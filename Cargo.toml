[workspace]
resolver = "2"
members = [
    "crates/reelget-core",
    "crates/reelget-cli",
    "crates/reelget-ffi",
    "crates/reelget-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ReelGet Contributors"]
repository = "https://github.com/adiditm/ReelGet"
rust-version = "1.85"

[workspace.dependencies]
aes = "0.8.4"
async-trait = "0.1.92"
bytes = "1.11.1"
cbc = "0.1.2"
clap = { version = "4.6.10", features = ["derive"] }
dirs = "6.0"
eframe = { version = "0.32.3", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.32.3"
futures-util = "0.3.34"
indicatif = "0.18.6"
jni = "0.21.1"
regex = "1.13.2"
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "charset",
    "http2",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "stream",
    "json",
] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
scraper = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.7"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "sync",
    "time",
    "process",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
